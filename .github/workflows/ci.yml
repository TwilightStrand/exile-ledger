name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:firefox
      # The linter addons.mozilla.org runs on upload; warnings fail here so they
      # are fixed before submission instead of explained to reviewers.
      - run: npx --yes addons-linter@10.16.0 --warnings-as-errors .output/firefox-mv3
